disabled_rules:
  - colon
  - comma
  - control_statement
  - nesting
  - cyclomatic_complexity
  - trailing_comma
  - opening_brace
  - type_body_length
  - unused_setter_value
  - generic_type_name
  - void_function_in_ternary
  - multiple_closures_with_trailing_closure
  - optional_data_string_conversion
  - closure_parameter_position

opt_in_rules:
  - empty_count
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - contains_over_first_not_nil
  - empty_string
  - prefer_self_type_over_type_of_self
  - unneeded_parentheses_in_closure_argument
  - sorted_imports

included:
  - Cleeth

unused_closure_parameter: error
force_cast: warning
force_try:
  severity: warning
line_length:
  warning: 160
  error: 160
  ignores_comments: true
file_length:
  warning: 1000
  error: 1000
function_body_length:
  warning: 80
  error: 80
type_name:
  min_length: 3
  max_length:
    warning: 60
    error: 70
  excluded:
    - iPhone
    - ID
  allowed_symbols: ["_", "`"]
identifier_name:
  min_length:
    error: 3
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - URL
    - GlobalAPIKey
    - Current
  allowed_symbols: ["_", "`"]
large_tuple:
  warning: 2
  error: 2
reporter: "xcode"
custom_rules:
  xcode_template:
    name: "XCode Template"
    regex: "(\/\\*@START_MENU_TOKEN@\\*\/.*?\/\\*@END_MENU_TOKEN@\\*\/)"
    message: "XCode generated code templates should be applied or removed."
    severity: warning
